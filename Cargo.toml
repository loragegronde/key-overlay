[package]
name = "key-overlay"
version = "0.1.0"
description = "Lightweight keyboard / mouse / controller overlay (pure Rust)"
authors = ["Auguste"]
edition = "2021"
rust-version = "1.74"

[[bin]]
name = "key-overlay"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "wgpu"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"
gilrs = "0.10"
once_cell = "1"
directories = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.15"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
] }
global-hotkey = "0.6"
tray-icon = "0.19"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
