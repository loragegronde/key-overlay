[package]
name = "key-overlay"
version = "0.1.0"
description = "Customizable keyboard and touch overlay"
authors = ["Auguste"]
edition = "2021"

[lib]
name = "key_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for `transparent: true` to have any effect on
# macOS. It must stay in sync with `app.macOSPrivateApi` in tauri.conf.json, and
# it makes the app ineligible for the Mac App Store.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
# Native Save As / Open dialogs, used only by profile export and import.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rdev::listen uses X11 on Linux and does not receive events under Wayland.
rdev = "0.5"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
# Foreground-window / process lookup for app-scoped overlay visibility.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
